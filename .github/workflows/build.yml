name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches typos in the .ps1 sources without running them (the reader needs a
      # real Windows desktop session, so it cannot be executed on CI).
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$v"

      - name: Build portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/build-release.ps1 -Version $env:VERSION

      - name: Build single-file exe
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/build-exe.ps1 -Version $env:VERSION

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS binaries
        run: ./macos/build.sh "$RUNNER_TEMP/bin"

      - name: Smoke test (compile + CLI, no audio)
        run: |
          "$RUNNER_TEMP/bin/rime-tts-watcher" --help >/dev/null
          "$RUNNER_TEMP/bin/rime-tts-menubar" --status >/dev/null
          for f in macos/*.sh macos/rime-tts; do sh -n "$f"; done

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # A runnable tree: the two Swift binaries plus the CLI and install script.
      # Layout matches the repo (bin/, macos/, rime/) so `./install.sh` works.
      - name: Package macOS app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/pkg/rime-tts-readback-$VERSION"
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$PKG/bin"
          cp -R macos "$PKG/macos"
          cp -R rime "$PKG/rime"
          cp -R icons "$PKG/icons"
          cp README.md README.en.md LICENSE "$PKG/"
          cp "$RUNNER_TEMP/bin/"* "$PKG/bin/"
          printf '%s\n' "$VERSION" > "$PKG/VERSION.txt"
          printf '#!/bin/sh\nexec "$(dirname "$0")/macos/install.sh" --no-build "$@"\n' > "$PKG/install.sh"
          chmod +x "$PKG/install.sh"
          mkdir -p dist
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/dist/rime-tts-readback-$VERSION-macos.zip" "rime-tts-readback-$VERSION")
          ls -lh dist

      # The .app keeps the watcher and rime.lua beside the menubar binary, so a
      # plain drag-to-Applications install is enough (no Xcode / install.sh).
      - name: Package macOS DMG
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          chmod +x packaging/macos/make-dmg.sh
          ./packaging/macos/make-dmg.sh "$VERSION" "$RUNNER_TEMP/bin" "$GITHUB_WORKSPACE/dist"
          ls -lh dist

      - name: Verify macOS DMG
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" \
            "dist/rime-tts-readback-$VERSION.dmg"
          test -d "$mountpoint/RimeTtsReadback.app"
          test -x "$mountpoint/RimeTtsReadback.app/Contents/MacOS/rime-tts-menubar"
          test -f "$mountpoint/RimeTtsReadback.app/Contents/MacOS/rime-tts-watcher"
          test -f "$mountpoint/RimeTtsReadback.app/Contents/MacOS/rime.lua"
          hdiutil detach "$mountpoint"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # The Linux side is pure standard-library Python, so syntax checks, unit
      # tests and the CLI/installer smoke tests all run without a display.
      - name: Syntax check
        run: |
          python -m py_compile linux/*.py linux/rime-tts
          bash -n linux/install.sh
          bash -n linux/uninstall.sh

      - name: Unit tests
        working-directory: linux
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test (no audio)
        env:
          RIME_TTS_STATE: ${{ runner.temp }}/state
          RIME_USER_DIR: ${{ runner.temp }}/rime
          RIME_TTS_DIR: ${{ runner.temp }}/rime/tts_queue
        run: |
          python linux/rime-tts version
          python linux/rime-tts check
          python linux/rime_tts_reader.py --check

      - name: Installer smoke test
        run: |
          bash ./linux/install.sh --prefix "$RUNNER_TEMP/inst" --rime-dir "$RUNNER_TEMP/rime" --no-start
          test -x "$RUNNER_TEMP/inst/bin/rime-tts"
          test -f "$RUNNER_TEMP/rime/rime.lua"
          test -f "$RUNNER_TEMP/inst/share/rime.lua"
          test -f "$RUNNER_TEMP/inst/config.json"
          "$RUNNER_TEMP/inst/bin/rime-tts" status
          bash ./linux/uninstall.sh --prefix "$RUNNER_TEMP/inst" --rime-dir "$RUNNER_TEMP/rime" --no-reload -y
          test ! -e "$RUNNER_TEMP/rime/rime.lua"

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Portable tree: extract it and run ./install.sh (or linux/install.sh).
      # Python 3 and a system TTS engine (spd-say / espeak-ng) stay external.
      - name: Package Linux app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/pkg/rime-tts-readback-$VERSION"
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          cp -R linux rime icons "$PKG/"
          cp README.md README.en.md LICENSE "$PKG/"
          find "$PKG" -type d -name __pycache__ -prune -exec rm -rf {} +
          printf '%s\n' "$VERSION" > "$PKG/VERSION.txt"
          printf '#!/bin/sh\nexec "$(dirname "$0")/linux/install.sh" "$@"\n' > "$PKG/install.sh"
          chmod +x "$PKG/install.sh"
          mkdir -p dist
          tar -czf "dist/rime-tts-readback-$VERSION-linux.tar.gz" -C "$RUNNER_TEMP/pkg" "rime-tts-readback-$VERSION"
          ls -lh dist

      # A real single-file AppImage with a bundled CPython + Tk.  The system
      # still provides the speech engine (spd-say/espeak-ng).
      - name: Package Linux AppImage
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          chmod +x packaging/linux/make-appimage.sh
          ./packaging/linux/make-appimage.sh "$VERSION" "$GITHUB_WORKSPACE/dist"
          ls -lh dist

      - name: AppImage smoke test
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/rime-tts-readback-$VERSION-x86_64.AppImage" version

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  # Runs only for tag pushes. Collects the three platform assets produced above
  # and attaches them (plus a checksum file) to the GitHub Release for the tag.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest

    steps:
      # Needed for CHANGELOG.md and for finding the previous tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Turn the matching CHANGELOG section into the release body.  If the tag
      # has no section yet, fall back to the commit list instead of the bare
      # "Full Changelog" link that GitHub generates for direct commits.
      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## " ver "([[:space:]]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-body.md
          else
            : > release-body.md
          fi

          if [ ! -s release-body.md ]; then
            {
              echo "## 变更"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s (%h)' "$PREV..$GITHUB_REF_NAME"
              else
                git log --no-merges --pretty='- %s (%h)' -20
              fi
            } > release-body.md
          else
            {
              echo "## 变更"
              echo
              cat release-body.md
            } > release-body.tmp
            mv release-body.tmp release-body.md
          fi

          if [ -n "$PREV" ]; then
            echo >> release-body.md
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}" >> release-body.md
          fi
          cat release-body.md

      - name: Checksums
        run: |
          cd release
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: rime-tts-readback ${{ github.ref_name }}
          body_path: release-body.md
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
